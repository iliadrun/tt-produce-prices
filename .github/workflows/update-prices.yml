# Runs on GitHub's servers - fetches new NAMIS reports, commits the data,
# and redeploys the website. Two schedules: the main run after reports land
# (~2:30 pm Trinidad at the latest), and a next-morning retry that also
# heals any day the main run missed (the 10-day fetch window re-checks
# recent gaps every time).
name: Update prices and deploy

on:
  schedule:
    - cron: "30 19 * * 1-5"   # 3:30 pm Trinidad time (UTC-4), Mon-Fri
    - cron: "0 11 * * 2-6"    # 7:00 am Trinidad, Tue-Sat (retry/catch-up)
  workflow_dispatch:           # the manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # JavaScript actions also use this refreshed system store instead of their
      # runner-bundled Node CA list. Keep this before the first JavaScript action.
      - name: Refresh system certificate trust
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade --yes ca-certificates
          dpkg-query -W ca-certificates

      - name: Verify Node rejects compromised eMudhra chains
        run: |
          node --input-type=module <<'JS'
          import tls from "node:tls";
          const deniedHosts = ["dv-g3b","dv-g3c","ov-g3b","ov-g3c","ev-g3b","ev-g3c"].flatMap(name => [name+"-emudhra.we-have-a-problem.com",name+"-aaa-emudhra.we-have-a-problem.com"]);
          const trustErrors = new Set(["CERT_REVOKED","UNABLE_TO_GET_ISSUER_CERT","UNABLE_TO_GET_ISSUER_CERT_LOCALLY","UNABLE_TO_VERIFY_LEAF_SIGNATURE","SELF_SIGNED_CERT_IN_CHAIN"]);
          function probe(host, expectedTrusted) {
            return new Promise(resolve => {
              let finished = false;
              const socket = tls.connect({host,port:443,servername:host,rejectUnauthorized:true});
              const finish = (trusted, code) => {
                if (finished) return;
                finished = true;
                socket.destroy();
                resolve({host,expectedTrusted,trusted,code,ok:expectedTrusted?trusted:!trusted&&trustErrors.has(code)});
              };
              socket.once("secureConnect",()=>finish(true,null));
              socket.once("error",error=>finish(false,error.code||error.name));
              socket.setTimeout(10000,()=>finish(false,"TIMEOUT"));
            });
          }
          export async function checkTrust() {
            const results = await Promise.all([...deniedHosts.map(host=>probe(host,false)),...["nodejs.org","github.com"].map(host=>probe(host,true))]);
            return {node:process.version,ok:results.every(result=>result.ok),results};
          }
          
          const result = await checkTrust();
          console.log(JSON.stringify(result,null,2));
          if(!result.ok)process.exitCode=1;
          JS

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Bootstrap the corrected pip using the wheel digest published by the
      # Python security team; an older pip has its own stale CA bundle.
      - name: Update Python certificate tooling
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade "certifi>=2026.10.19"
          python -m pip --version

      - name: Verify Python rejects compromised eMudhra chains
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import socket
          import ssl
          import sys
          import certifi
          from pip._vendor import certifi as pip_certifi
          
          blocked = [
              f"{kind}-{chain}-emudhra.we-have-a-problem.com"
              for kind in ("dv-g3b", "dv-g3c", "ov-g3b", "ov-g3c", "ev-g3b", "ev-g3c")
              for chain in ("", "aaa")
          ]
          blocked = [host.replace("--emudhra", "-emudhra") for host in blocked]
          contexts = {
              "system": ssl.create_default_context(),
              "certifi": ssl.create_default_context(cafile=certifi.where()),
              "pip": ssl.create_default_context(cafile=pip_certifi.where()),
          }
          trust_errors = {19, 20, 21, 23, 27}
          
          def probe(item):
              name, host, expected = item
              try:
                  with socket.create_connection((host, 443), timeout=10) as connection:
                      with contexts[name].wrap_socket(connection, server_hostname=host):
                          return {"store": name, "host": host, "ok": expected, "trusted": True}
              except ssl.SSLCertVerificationError as error:
                  return {"store": name, "host": host, "ok": not expected and error.verify_code in trust_errors,
                          "trusted": False, "verify_code": error.verify_code}
              except (OSError, ssl.SSLError) as error:
                  return {"store": name, "host": host, "ok": False, "error": type(error).__name__}
          
          checks = [
              (name, host, expected)
              for name in contexts
              for host, expected in [(host, False) for host in blocked] + [
                  ("files.pythonhosted.org", True), ("github.com", True)
              ]
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              results = list(pool.map(probe, checks))
          print(json.dumps({"python": sys.version.split()[0], "results": results}, indent=2))
          if not all(result["ok"] for result in results):
              raise SystemExit("TLS trust checks failed; refusing to fetch or publish price data.")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch any new reports
        run: python scraper/fetch_daily.py --since "$(date -d '10 days ago' +%F)"

      # The retail survey is monthly and overwritten in place on NAMDEVCO's
      # server — checking on every run is one cheap page request, and any
      # month we miss is lost for good. A retail failure never blocks the
      # daily wholesale update, but the follow-up annotation keeps it
      # visible on the run summary (continue-on-error alone leaves the
      # whole run green, which would hide a persistent breakage).
      - name: Fetch the monthly retail survey
        id: retail
        continue-on-error: true
        run: python scraper/fetch_retail.py

      - name: Flag a retail fetch failure
        if: steps.retail.outcome == 'failure'
        run: echo "::warning::Retail survey fetch failed — see the step above. Months not captured are lost for good."

      # The monthly wholesale price/volume history (the 2006-present averages
      # behind the charts) is published on NAMDEVCO as two cumulative workbooks,
      # re-uploaded once a month. Checking on every run is one cheap page
      # request that re-uses the same market-information page as retail, and the
      # upload epoch in the link means an unchanged month downloads nothing.
      # A failure never blocks the daily wholesale update, but is surfaced.
      - name: Fetch the monthly wholesale averages
        id: monthly
        continue-on-error: true
        run: python scraper/fetch_monthly_wholesale.py

      - name: Flag a monthly wholesale fetch failure
        if: steps.monthly.outcome == 'failure'
        run: echo "::warning::Monthly wholesale averages fetch failed — see the step above."

      - name: Commit new data and rebuild site files
        run: |
          git add data
          if ! git diff --cached --quiet; then
            python scraper/build_site_data.py
            git add data site/data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Price data update $(date -u +%F)"
            git push
          else
            echo "No new data today."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
